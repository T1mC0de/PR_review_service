version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: pr_reviewer
      POSTGRES_USER: pr_user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d 
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pr_user -d pr_reviewer"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://pr_user:password@postgres:5432/pr_reviewer?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: